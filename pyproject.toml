[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldscope-internal"
version = "0.1.0"
description = "Reading relational geometry from frozen generative flows."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "torch>=2.4",
  "torchvision>=0.19",
  "tqdm>=4.66",
]

[project.optional-dependencies]
backbone = [
  "accelerate>=1.0",
  "diffusers>=0.36,<0.39",
  "huggingface-hub>=0.34",
  "protobuf>=5.0",
  "safetensors>=0.4",
  "sentencepiece>=0.2",
  "transformers>=4.48,<6",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.9",
]
data = [
  "h5py>=3.10",
  "scipy>=1.11",
]

[project.scripts]
fieldscope = "fieldscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
