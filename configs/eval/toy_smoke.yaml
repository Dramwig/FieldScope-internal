backend:
  name: toy
  device: cpu
  dtype: float32
  image_size: 64

probe:
  times: [0.2, 0.5, 0.8]
  num_directions: 4
  eta: 0.03
  difference: central
  graph_grid: [8, 8]
  topk: 8
  local_radius: 1
  probe_batch_size: 8
  antithetic_noise: true
  hidden_baseline_dim: 768
  seed: 4121

tokenizer:
  hidden_dim: 64
  input_dim: 768
  num_layers: 2
  dropout: 0.0
  num_classes: 2
  segmentation_classes: 3

runtime:
  output_dir: outputs/smoke/toy
  cache_dir: artifacts/cache
  batch_size: 2
  num_workers: 0
  deterministic: true
