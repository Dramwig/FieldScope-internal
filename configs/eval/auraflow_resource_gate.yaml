backend:
  name: auraflow
  model_path: ${FIELDSCOPE_CHECKPOINTS_ROOT}/AuraFlow-v0.3
  variant: fp16
  device: cuda
  dtype: bfloat16
  image_size: 256
  prompt: ""
  max_sequence_length: 256
  local_files_only: true
  offload_text_encoder: true

probe:
  times: [0.2, 0.5, 0.8]
  num_directions: 2
  eta: 0.03
  difference: central
  graph_grid: [8, 8]
  topk: 8
  local_radius: 1
  probe_batch_size: 1
  antithetic_noise: true
  seed: 4121

tokenizer:
  hidden_dim: 128
  num_layers: 3
  dropout: 0.1
  num_classes: 100
  segmentation_classes: 21

runtime:
  output_dir: outputs/resource_gate/auraflow_r2
  cache_dir: ${FIELDSCOPE_DATASETS_ROOT}/feature_cache/resource_gate/auraflow_r2
  batch_size: 1
  num_workers: 0
  deterministic: true
